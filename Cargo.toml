[package]
name = "entscript-converter"
version = "0.2.0"
edition = "2021"
description = "Entscript to Entry project JSON compiler"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "entscript"
path = "src/main.rs"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]
